<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shadow Archer — Portrait Cover 800×1200</title>
  <link rel="stylesheet" href="./_shared.css" />
  <style>
    .cover { width: 800px; height: 1200px; }
    .title-wrap { top: 60px; left: 0; right: 0; text-align: center; }
    .title { font-size: 120px; }
    .subtitle { font-size: 22px; margin-top: 10px; }
    .chip-row { justify-content: center; margin-top: 980px; padding: 0 30px; gap: 8px; }
    .chip { font-size: 13px; padding: 8px 14px; letter-spacing: 0.12em; }
    .hero-stand { left: 50%; top: 300px; transform: translateX(-50%); }
    .hero-stand svg { width: 560px; height: auto; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9)); }
  </style>
</head>

    <div class="chip-row">
      <div class="chip">🏹 Ragdoll</div>
      <div class="chip">26 Stages</div>
      <div class="chip">Endless</div>
    </div>
    <div class="chip-row" style="margin-top: 12px;">
      <div class="chip">7 Heroes</div>

</html>
