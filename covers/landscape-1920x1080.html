<!doctype html>

  <style>
    .cover { width: 1920px; height: 1080px; }
    .title-wrap { right: 100px; top: 150px; max-width: 1050px; text-align: right; }
    .title { font-size: 220px; }
    .subtitle { font-size: 44px; margin-top: 20px; }
    .chip-row { justify-content: flex-end; margin-top: 48px; }
    .chip { font-size: 24px; padding: 14px 28px; }

      position: absolute; bottom: 0; left: 0; right: 0; height: 220px;
      background:
        linear-gradient(180deg, transparent, rgba(0,0,0,0.9) 80%),
        radial-gradient(ellipse at 20% 100%, #1a1a2e 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #1a1a2e 0%, transparent 50%);
      z-index: 1;
    }
    .glow-arrow {
      position: absolute; top: 320px; right: 240px;
      width: 420px; height: 10px;
      background: linear-gradient(90deg, transparent, #ffd770, #fff);
      transform: rotate(-18deg);
      box-shadow: 0 0 30px #ffbf47, 0 0 60px #ff8f33;
      z-index: 2;
    }
  </style>
</head>
